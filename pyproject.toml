[project]
name = "task-management-api"
version = "0.1.0"
description = "Task Management API — Clean Architecture (FastAPI + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1",
    "import-linter>=2.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
extend-exclude = [".claude"]

[tool.pyright]
include = ["domain", "application", "infrastructure", "presentation"]
strict = ["domain", "application"]

[tool.importlinter]
root_packages = ["domain", "application", "infrastructure", "presentation"]

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
# colon: presentation may import infrastructure directly for DI wiring (composition root)
layers = [
    "presentation : infrastructure",
    "application",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Infrastructure must not import presentation"
type = "forbidden"
# closes the direction the colon above leaves open (siblings could otherwise import each other)
source_modules = ["infrastructure"]
forbidden_modules = ["presentation"]
